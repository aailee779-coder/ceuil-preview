<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Inter, system-ui, sans-serif" font-size="13" fill="none" stroke="#1C1A18" stroke-width="1.6">
  <!-- Indicative south elevation of Villa Type 2, from plan dimensions (EN p.10–11). Scale: 1 m = 25 px; ground at y=330. -->
  <line x1="40" y1="330" x2="1160" y2="330" stroke-width="1"/>
  <!-- ground floor -->
  <rect x="160" y="242" width="125" height="88"/><rect x="285" y="242" width="220" height="88"/><rect x="505" y="242" width="118" height="88"/>
  <g stroke-width="1" opacity=".55"><line x1="310" y1="242" x2="310" y2="330"/><line x1="360" y1="242" x2="360" y2="330"/><line x1="410" y1="242" x2="410" y2="330"/><line x1="460" y1="242" x2="460" y2="330"/><line x1="530" y1="242" x2="530" y2="330"/><line x1="575" y1="242" x2="575" y2="330"/></g>
  <rect x="612" y="242" width="11" height="88" fill="#6b3a1f" stroke="none"/>
  <!-- slab -->
  <rect x="155" y="234" width="475" height="8" fill="#1C1A18" stroke="none"/>
  <!-- first floor -->
  <rect x="162" y="152" width="120" height="82"/><rect x="282" y="152" width="122" height="82"/><rect x="367" y="152" width="250" height="82"/>
  <g stroke-width="1" opacity=".55"><line x1="430" y1="152" x2="430" y2="234"/><line x1="490" y1="152" x2="490" y2="234"/><line x1="550" y1="152" x2="550" y2="234"/></g>
  <rect x="605" y="152" width="12" height="82" fill="#6b3a1f" stroke="none"/>
  <!-- folded roof planes -->
  <path d="M150 152 L292 152 L292 138 L150 124 Z" fill="#fff"/><path d="M276 152 L410 152 L410 140 L276 140 Z" fill="#fff"/><path d="M360 152 L672 152 L672 116 L360 138 Z" fill="#fff"/>
  <!-- terrace + rail -->
  <rect x="617" y="226" width="52" height="8" fill="#1C1A18" stroke="none"/><line x1="669" y1="200" x2="669" y2="226" stroke-dasharray="3 3"/>
  <!-- pool -->
  <rect x="747" y="326" width="88" height="6" fill="#7fb7bd" stroke="none"/>
  <!-- palms -->
  <g stroke-width="1.2"><line x1="110" y1="330" x2="114" y2="150"/><path d="M114 150 q-30 4 -46 24 M114 150 q30 2 44 22 M114 150 q-18 -16 -40 -12 M114 150 q20 -14 42 -8"/>
  <line x1="930" y1="330" x2="926" y2="170"/><path d="M926 170 q-30 4 -46 24 M926 170 q30 2 44 22 M926 170 q-18 -16 -40 -12 M926 170 q20 -14 42 -8"/></g>

  <g stroke-width="1" stroke="#8a8378"><line x1="45" y1="372" x2="1097" y2="372"/><line x1="45" y1="364" x2="45" y2="380"/><line x1="1097" y1="364" x2="1097" y2="380"/>
  <line x1="1130" y1="330" x2="1130" y2="116"/><line x1="1122" y1="330" x2="1138" y2="330"/><line x1="1122" y1="116" x2="1138" y2="116"/><line x1="672" y1="116" x2="1130" y2="116" stroke-dasharray="2 4"/></g>
  <g fill="#1C1A18" stroke="none" font-size="14" letter-spacing=".02em"><text x="571" y="398" text-anchor="middle">42.10 m¹</text><text x="1112" y="228" text-anchor="end">R+1</text></g>
